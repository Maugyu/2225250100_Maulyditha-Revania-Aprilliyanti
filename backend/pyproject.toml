[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]  # berkas migrasi hasil templat Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() di default argumen adalah pola FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/services/ai.py" = ["E501"]
"app/services/tutor.py" = ["E501"]  # teks prompt & rubrik lebih mudah dibaca utuh

[tool.pytest.ini_options]
testpaths = ["tests"]
