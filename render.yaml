# Render Blueprint — backend FastAPI (API saja; frontend di Netlify, lihat netlify.toml).
# Panduan: project-planning/testing/DEPLOYMENT_GUIDE.md §4b.
services:
  - type: web
    name: jelajahgaris-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrasi skema + muat konten (idempoten) setiap kali server dinyalakan, lalu jalankan API.
    # --proxy-headers: Render & Netlify meneruskan permintaan lewat proxy (HTTPS di depan).
    startCommand: >-
      alembic upgrade head &&
      python -m app.cli seed-content &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true # dibuat acak oleh Render
      - key: DATABASE_URL
        sync: false # isi di dashboard: connection string dari Neon (postgresql://...)
      - key: GEMINI_API_KEY
        sync: false # isi di dashboard; JANGAN di-commit ke GitHub
      - key: LOG_LEVEL
        value: INFO
